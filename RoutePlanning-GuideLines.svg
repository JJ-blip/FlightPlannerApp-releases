<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img" font-family="Segoe UI, Arial, sans-serif">
<title>How a drawn guide line is used</title>
<desc>A leg from WP 1 to WP 2 with a line the pilot drew along a ridge. The planned route flies freely to the line, stays within 300 metres of it along its length in the drawn direction, then flies freely on to WP 2. A dashed free plan is shown for comparison.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="80" y1="230" x2="600" y2="230" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/>
<polyline points="230,120 300,112 380,116 470,108" fill="none" stroke="#7F77DD" stroke-width="22" stroke-linejoin="round" stroke-linecap="round" opacity="0.25"/>
<path d="M80,230 C120,200 190,130 230,121 L300,107 L380,121 L470,103 C510,120 570,190 600,230" fill="none" stroke="#1D9E75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="230,120 300,112 380,116 470,108" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/>
<g fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1"><circle cx="80" cy="230" r="9"/><circle cx="600" cy="230" r="9"/></g>
<g fill="#5F5E5A" font-size="14" font-weight="600" text-anchor="middle"><text x="80" y="258">WP 1</text><text x="600" y="258">WP 2</text></g>
<g fill="#5F5E5A" font-size="12">
<text x="150" y="150" text-anchor="end">Free to your line</text>
<text x="350" y="84" text-anchor="middle">Within 300 m of your line</text>
<text x="548" y="150">Free to WP 2</text>
<text x="106" y="300" dominant-baseline="central">Your drawn line, flown in the direction you drew it</text>
<text x="106" y="325" dominant-baseline="central">Corridor: the route may move up to 300 m either side</text>
<text x="106" y="350" dominant-baseline="central">Planned route: parts joined, then flown whole; heights are the planner's</text>
<text x="106" y="375" dominant-baseline="central">Free plan, shown with Compare with Free Plan</text>
<text x="60" y="410" dominant-baseline="central">Ignored if over 10 km from the leg, under 300 m long, or equally close to two legs</text>
</g>
<line x1="60" y1="300" x2="96" y2="300" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="318" width="36" height="14" rx="4" fill="#7F77DD" opacity="0.3"/>
<line x1="60" y1="350" x2="96" y2="350" stroke="#1D9E75" stroke-width="3" stroke-linecap="round"/>
<line x1="60" y1="375" x2="96" y2="375" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/>
</svg>
